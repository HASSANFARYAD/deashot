name: Deploy

# Deploys the game to the production VPS via Docker Compose over SSH.
#
# Wiring (once, by the owner):
#   GH repo → Settings → Secrets and variables → Actions:
#     DEPLOY_HOST          e.g. 203.0.113.10 (raw IP, no TLS yet)
#     DEPLOY_USER          SSH user with access to the repo checkout
#     DEPLOY_SSH_KEY       private key (ed25519) for the SSH user
#     DEPLOY_ENV           full contents of the server `.env`
#                          (JWT_SECRET, POSTGRES_PASSWORD, VITE_SERVER_URL,
#                           ALLOWED_ORIGINS, REDIS_URL, SENTRY_DSN ...)
#
# The workflow is inert (echoes "not configured") until all four secrets are
# present, so it is safe to merge before the VPS exists.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard on secrets
        id: guard
        shell: bash
        run: |
          MISSING=""
          for s in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_ENV; do
            if [ -z "${{ secrets[s] }}" ]; then MISSING="$MISSING $s"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::notice ::Deploy skipped — secrets not configured:$MISSING"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - name: Deploy via Compose
        if: steps.guard.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV_CONTENT: ${{ secrets.DEPLOY_ENV }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd deashot
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            echo "$DEPLOY_ENV_CONTENT" > .env
            docker compose up -d --build --remove-orphans
            docker compose ps