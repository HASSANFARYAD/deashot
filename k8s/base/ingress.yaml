apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deashot-ingress
  namespace: deashot
  labels:
    app.kubernetes.io/part-of: deashot
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "game-server-service"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: deashot.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 4000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: game-server-service
                port:
                  number: 2567
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
