apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  namespace: deashot
  labels:
    app.kubernetes.io/name: game-server
    app.kubernetes.io/part-of: deashot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: game-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-server
        app.kubernetes.io/part-of: deashot
    spec:
      imagePullSecrets:
        - name: deashot-registry-cred
      initContainers:
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z redis-service 6379; do
                echo "Waiting for redis..."
                sleep 2
              done
      containers:
        - name: game-server
          image: deashot-game-server
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2567
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: deashot-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: deashot-config
                  key: PORT_GAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deashot-secrets
                  key: JWT_SECRET
            - name: REQUIRE_AUTH
              valueFrom:
                configMapKeyRef:
                  name: deashot-config
                  key: REQUIRE_AUTH
            - name: ALLOW_TEST_ROOM_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: deashot-config
                  key: ALLOW_TEST_ROOM_OPTIONS
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: deashot-secrets
                  key: REDIS_URL
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: deashot-secrets
                  key: SENTRY_DSN
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 2567
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 2567
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: game-server-service
  namespace: deashot
  labels:
    app.kubernetes.io/name: game-server
    app.kubernetes.io/part-of: deashot
spec:
  selector:
    app.kubernetes.io/name: game-server
  ports:
    - port: 2567
      targetPort: 2567
  type: ClusterIP
