apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: deashot
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: deashot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: deashot
    spec:
      imagePullSecrets:
        - name: deashot-registry-cred
      initContainers:
        - name: wait-for-api
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z api-service 4000; do
                echo "Waiting for API..."
                sleep 2
              done
        - name: wait-for-game-server
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z game-server-service 2567; do
                echo "Waiting for game-server..."
                sleep 2
              done
      containers:
        - name: web
          image: deashot-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /ping
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: deashot
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: deashot
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
