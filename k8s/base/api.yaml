apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: deashot
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: deashot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: deashot
    spec:
      imagePullSecrets:
        - name: deashot-registry-cred
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
      containers:
        - name: api
          image: deashot-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: deashot-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: deashot-config
                  key: PORT_API
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deashot-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: deashot-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deashot-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: deashot-config
                  key: POSTGRES_DB
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: deashot-secrets
                  key: ALLOWED_ORIGINS
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: deashot-secrets
                  key: SENTRY_DSN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: deashot
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: deashot
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
