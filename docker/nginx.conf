# Deashot web: static SPA + reverse proxy (API + WebSocket).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with long cache (hashed filenames from Vite).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: forward unknown routes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy (strip the /api prefix).
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip off;
    }

    # Colyseus WebSocket — MUST forward Upgrade headers or clients drop instantly.
    location /ws {
        proxy_pass http://game-server:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # A tiny liveness page for uptime checks at the edge.
    location = /ping {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
