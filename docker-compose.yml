services:
  api:
    build: ./docker/api
    ports:
      - "4000:4000"
    environment:
      - JWT_SECRET=deashot-dev-secret-change-me
      - DATABASE_URL=postgres://deashot:deashot@postgres:5432/deashot
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  game-server:
    build: ./docker/game-server
    ports:
      - "2567:2567"
    environment:
      - PORT=2567
    depends_on:
      - redis

  web:
    build: ./docker/web
    ports:
      - "80:80"
    depends_on:
      - api
      - game-server

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=deashot
      - POSTGRES_PASSWORD=deashot
      - POSTGRES_DB=deashot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
